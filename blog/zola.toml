title = "keithschulze"

# The URL the site will be built for
base_url = "https://keithschulze.com"

theme = "zola-bearblog"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

generate_feeds = true

feed_filenames = [
    "atom.xml",
    "rss.xml",
]

taxonomies = [
    { name = "categories", feed = true },
    { name = "tags", rss = true },
]

default_language = "en"

[translations]
no_posts = "No posts yet"
remove_filter = "Remove filter"
filtering_for = "Filtering for"
made_with = "Made with"
table_of_contents = "Table of contents"
language = "language"
site = "site"

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
render_emoji = true

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
date_format = "%Y-%m-%d"
webserver_sends_csp_headers = false

[extra.table_of_contents]
show = true
max_level = 2
visible_on_load = true

[[extra.main_menu]]
name = "blog"
url = "@/blog/_index.md"

[[extra.main_menu]]
name = "tags"
url = "/tags"

[[extra.main_menu]]
name = "github"
url = "https://github.com/keithschulze"

[[extra.main_menu]]
name = "linkedin"
url = "https://www.linkedin.com/in/keithschulze"

[[extra.main_menu]]
name = "mastodon"
url = "https://mastodon.nz/@keithschulze"
